name: Weekly digest

# Every Monday at 13:00 UTC, an hour after the daily run, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read   # it only reads the data branch
  issues: write    # to post the digest as an issue, which GitHub emails to you

concurrency:
  group: daily-pipeline   # waits for a daily run that's still going
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHORTAGESIGNAL_DATA_DIR: ${{ github.workspace }}/datastore
      DIGEST_SMTP_USER: ${{ secrets.DIGEST_SMTP_USER }}
      DIGEST_SMTP_PASSWORD: ${{ secrets.DIGEST_SMTP_PASSWORD }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      CLAUDE_CREDITS_USD: ${{ vars.CLAUDE_CREDITS_USD }}
      CLAUDE_CREDITS_SINCE: ${{ vars.CLAUDE_CREDITS_SINCE }}
      CLAUDE_KEY_EXPIRES: ${{ vars.CLAUDE_KEY_EXPIRES }}
    steps:
      - uses: actions/checkout@v6

      - name: Get the latest data
        uses: actions/checkout@v6
        with:
          ref: data
          path: datastore

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Build the digest, and email it if the email is set up
        run: python -m shortagesignal.digest --send --out digest

      - name: Keep the digest and the Excel list
        uses: actions/upload-artifact@v6
        with:
          name: weekly-digest-${{ github.run_number }}
          path: digest/
          retention-days: 90

      # Without an email account, the digest goes out as an issue instead. GitHub emails
      # you about new issues in your own repo, so it still lands in your inbox. Last
      # week's digest issue gets closed, so only the latest one stays open.
      - name: Post the digest as an issue
        if: env.DIGEST_SMTP_USER == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create digest --color 0E8A16 --description "Weekly digest" 2>/dev/null || true
          for n in $(gh issue list --label digest --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "A newer digest is out."
          done
          echo "" >> digest/digest.md
          echo "The Excel list of items that need a look is in the files of [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)." >> digest/digest.md
          gh issue create --title "$(head -n 1 digest/digest.md | sed 's/^# //')" \
            --body-file digest/digest.md --label digest
