name: CI

# Runs on every pull request and every change to main.
# main is protected, so a pull request can only merge when this passes.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the project and dev tools
        run: pip install -e ".[dev]"
      - name: Lint (code style and common mistakes)
        run: ruff check .
      - name: Tests
        run: pytest -q
      # A change to the dashboard must only change how it looks: every SQL query, the data it
      # reads, the passcode, the daily cap and every caveat stay as they are on the base branch.
      - name: Dashboard changes keep every query and caveat
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:app/streamlit_app.py > /tmp/old_app.py
          python scripts/check_ui_safety.py /tmp/old_app.py app/streamlit_app.py
