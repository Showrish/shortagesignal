name: Keep the dashboard awake

# Streamlit's free tier puts the dashboard to sleep when nobody visits for a while.
# This opens it in a headless browser every 4 hours, wakes it if it's asleep, and fails
# unless the dashboard itself loads. A screenshot of what it saw is kept with each run.
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, at 17 past, away from the daily run on the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Playwright drives the Google Chrome that GitHub's runners already have, so nothing
      # is installed with apt, the step that once failed when the runner couldn't reach
      # Ubuntu's package servers. Only if a runner ever lacks Chrome does it fetch
      # Playwright's own Chromium, still without apt, since the runner has its libraries.
      - name: Install Playwright
        timeout-minutes: 5
        run: |
          pip install playwright==1.47.0
          google-chrome --version || python -m playwright install chromium

      - name: Visit the dashboard
        timeout-minutes: 8
        run: python scripts/keep_awake.py

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-${{ github.run_id }}
          path: keep_awake.png
          retention-days: 7
          if-no-files-found: ignore
